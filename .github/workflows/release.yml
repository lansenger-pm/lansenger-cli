name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          PYPROJECT=$(grep -m1 '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Tag:           $TAG"
          echo "pyproject.toml: $PYPROJECT"
          if [ "$TAG" != "$PYPROJECT" ]; then
            echo "::error::Version mismatch — tag=$TAG pyproject=$PYPROJECT. Update pyproject.toml to match (see AGENTS.md)."
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  test:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A dependency may have been published minutes earlier while PyPI's
      # simple index is still catching up (observed 2026-09-23: lansenger-sdk
      # 1.9.1 was invisible for ~20 min). Retry instead of failing the release.
      - run: |
          for i in 1 2 3 4 5; do
            if pip install -e ".[dev]"; then
              exit 0
            fi
            echo "pip install failed (attempt $i/5) — retrying in 60s (PyPI index lag)..."
            sleep 60
          done
          exit 1
      - run: pytest -q

  publish:
    needs: [verify-version, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
